<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>FoodLink Cambodia - Product Film</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0f1411;
        font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif;
        color: #1c1c1e;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #fafafa;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      /* Studio Canvas Ambience */
      .studio-bg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at 50% 25%, #ffffff 0%, #f4f5f3 60%, #e8eae6 100%);
        z-index: 0;
      }
      .studio-vignette {
        position: absolute;
        inset: 0;
        box-shadow: inset 0 0 160px rgba(0, 0, 0, 0.04);
        pointer-events: none;
        z-index: 1;
      }
      .studio-grid {
        position: absolute;
        inset: 0;
        background-size: 60px 60px;
        background-image: 
          linear-gradient(to right, rgba(46, 125, 50, 0.03) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(46, 125, 50, 0.03) 1px, transparent 1px);
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="55.0"
      data-width="1920"
      data-height="1080"
    >
      <!-- Studio Backdrop -->
      <div class="studio-bg"></div>
      <div class="studio-grid"></div>
      <div class="studio-vignette"></div>

      <!-- ==================== SCENE COMPOSITIONS ==================== -->

      <!-- Scene 1: The Evening Dilemma Hook (0.0s – 10.0s) -->
      <div
        id="el-scene-1"
        class="scene clip"
        data-composition-id="scene-1-hook"
        data-composition-src="compositions/scene-1-hook.html"
        data-start="0"
        data-duration="10.0"
        data-track-index="0"
      ></div>

      <!-- Scene 2: Customer Discovery & BKK1 Map (9.5s – 21.5s) -->
      <div
        id="el-scene-2"
        class="scene clip"
        data-composition-id="scene-2-discovery"
        data-composition-src="compositions/scene-2-discovery.html"
        data-start="9.5"
        data-duration="12.0"
        data-track-index="1"
      ></div>

      <!-- Scene 3: Bakong KHQR Instant Checkout (21.0s – 32.5s) -->
      <div
        id="el-scene-3"
        class="scene clip"
        data-composition-id="scene-3-checkout"
        data-composition-src="compositions/scene-3-checkout.html"
        data-start="21.0"
        data-duration="11.5"
        data-track-index="0"
      ></div>

      <!-- Scene 4: Merchant Kitchen Alert & PIN Handover (32.0s – 43.5s) -->
      <div
        id="el-scene-4"
        class="scene clip"
        data-composition-id="scene-4-kitchen"
        data-composition-src="compositions/scene-4-kitchen.html"
        data-start="32.0"
        data-duration="11.5"
        data-track-index="1"
      ></div>

      <!-- Scene 5: Ecological Impact & Dual QR Call-To-Action (43.0s – 55.0s) -->
      <div
        id="el-scene-5"
        class="scene clip"
        data-composition-id="scene-5-impact"
        data-composition-src="compositions/scene-5-impact.html"
        data-start="43.0"
        data-duration="12.0"
        data-track-index="0"
      ></div>

      <!-- ==================== ENERGETIC TECH HOUSE SOUNDTRACK ==================== -->
      <audio
        id="bgm-tech"
        class="clip"
        src="assets/audio/bgm-ambient-tech.mp3"
        data-start="0"
        data-duration="55.0"
        data-track-index="2"
        data-volume="0.25"
      ></audio>

      <!-- ==================== STUDIO HUMAN STORY VOICEOVER ==================== -->
      <!-- Scene 1: Phnom Penh Evening Surplus Dilemma -->
      <audio
        id="vo-scene-1"
        class="clip"
        src="assets/audio/voiceover/vo-1.mp3"
        data-start="0.5"
        data-duration="8.42"
        data-track-index="4"
        data-volume="1.0"
      ></audio>

      <!-- Scene 2: Sokha & CAD Bakery BKK1 Connection -->
      <audio
        id="vo-scene-2"
        class="clip"
        src="assets/audio/voiceover/vo-2.mp3"
        data-start="10.0"
        data-duration="10.73"
        data-track-index="4"
        data-volume="1.0"
      ></audio>

      <!-- Scene 3: Bakong Instant Pay & Digital Counter Pass -->
      <audio
        id="vo-scene-3"
        class="clip"
        src="assets/audio/voiceover/vo-3.mp3"
        data-start="21.8"
        data-duration="8.35"
        data-track-index="4"
        data-volume="1.0"
      ></audio>

      <!-- Scene 4: CAD Bakery Kitchen Handover & PIN Verification -->
      <audio
        id="vo-scene-4"
        class="clip"
        src="assets/audio/voiceover/vo-4.mp3"
        data-start="32.5"
        data-duration="8.95"
        data-track-index="4"
        data-volume="1.0"
      ></audio>

      <!-- Scene 5: Outro Mutual Impact & Dual QR Call-To-Action -->
      <audio
        id="vo-scene-5"
        class="clip"
        src="assets/audio/voiceover/vo-5.mp3"
        data-start="43.5"
        data-duration="7.90"
        data-track-index="4"
        data-volume="1.0"
      ></audio>

      <!-- ==================== TACTILE UI SOUND EFFECTS ==================== -->
      <!-- 1. Authentic mechanical mouse click on card reservation -->
      <audio
        id="snd-click"
        class="clip"
        src="assets/audio/mouse-click.mp3"
        data-start="17.5"
        data-duration="0.04"
        data-track-index="6"
        data-volume="0.85"
      ></audio>

      <!-- 2. Resonant Bakong payment confirmation chime -->
      <audio
        id="snd-khqr"
        class="clip"
        src="assets/audio/khqr-chime.mp3"
        data-start="24.8"
        data-duration="0.40"
        data-track-index="6"
        data-volume="0.85"
      ></audio>

      <!-- 3. Kitchen real-time order alert ping -->
      <audio
        id="snd-ping"
        class="clip"
        src="assets/audio/order-ping.mp3"
        data-start="33.0"
        data-duration="0.35"
        data-track-index="6"
        data-volume="0.90"
      ></audio>

      <!-- 4. PIN counter verification success ding -->
      <audio
        id="snd-verify"
        class="clip"
        src="assets/audio/verify-ding.mp3"
        data-start="40.5"
        data-duration="0.50"
        data-track-index="6"
        data-volume="0.85"
      ></audio>

      <!-- ==================== CINEMATIC TRANSITION WHOOSHES ==================== -->
      <audio
        id="snd-whoosh-1"
        class="clip"
        src="assets/audio/whoosh.mp3"
        data-start="9.2"
        data-duration="0.55"
        data-track-index="7"
        data-volume="0.55"
      ></audio>

      <audio
        id="snd-whoosh-2"
        class="clip"
        src="assets/audio/whoosh.mp3"
        data-start="20.7"
        data-duration="0.55"
        data-track-index="7"
        data-volume="0.55"
      ></audio>

      <audio
        id="snd-whoosh-3"
        class="clip"
        src="assets/audio/whoosh.mp3"
        data-start="31.7"
        data-duration="0.55"
        data-track-index="7"
        data-volume="0.55"
      ></audio>

      <audio
        id="snd-whoosh-4"
        class="clip"
        src="assets/audio/whoosh.mp3"
        data-start="42.7"
        data-duration="0.55"
        data-track-index="7"
        data-volume="0.60"
      ></audio>

    </div>

    <script>
      (function() {
        const tl = gsap.timeline({ paused: true });
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
