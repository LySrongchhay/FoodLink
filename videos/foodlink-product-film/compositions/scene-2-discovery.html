      // 4.0s: Highlight the target food card
      tl.to("#target-food-card", {
        boxShadow: "0 16px 36px rgba(46, 125, 50, 0.25)",
        borderColor: "#2e7d32",
        scale: 1.02,
        duration: 0.6,

      // Camera straightens up toward the reservation action

        rotationY: 0,
        rotationX: 0,
        duration: 0.8,
        ease: "power2.inOut"

        x: 325,
        y: 365,
        opacity: 1,
        scale: 1,
        duration: 0.8,
        ease: "power2.out"

      tl.to("#tap-pointer", {

        backgroundColor: "rgba(46, 125, 50, 0.6)",
