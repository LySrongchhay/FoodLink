name: Deploy Portals to Vercel

on:
  push:
    branches:
      - main
    paths:
      - 'foodlink-ui/**'
      - '.github/workflows/deploy-vercel.yml'
  workflow_dispatch:

jobs:
  deploy-customer:
    name: Deploy Customer Portal
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: foodlink-ui
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: foodlink-ui/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Customer Bundle
        run: npm run build:customer
        env:
          VITE_PORTAL_MODE: customer

      - name: Deploy to Vercel (Customer)
        if: ${{ env.VERCEL_TOKEN != '' }}
        run: npx --yes vercel deploy --prod --yes --name foodlink-customer
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_CUSTOMER }}

      - name: Notice (VERCEL_TOKEN not set)
        if: ${{ env.VERCEL_TOKEN == '' }}
        run: |
          echo "::warning title=Vercel Token Required::VERCEL_TOKEN secret is not set in GitHub repository settings. The bundle was built successfully, but automatic Vercel deployment was skipped. To enable automatic Vercel deployment, add your token to GitHub Settings -> Secrets and variables -> Actions."
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

  deploy-merchant:
    name: Deploy Merchant Portal
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: foodlink-ui
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: foodlink-ui/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Merchant Bundle
        run: npm run build:merchant
        env:
          VITE_PORTAL_MODE: merchant

      - name: Deploy to Vercel (Merchant)
        if: ${{ env.VERCEL_TOKEN != '' }}
        run: npx --yes vercel deploy --prod --yes --name foodlink-merchant
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_MERCHANT }}

      - name: Notice (VERCEL_TOKEN not set)
        if: ${{ env.VERCEL_TOKEN == '' }}
        run: |
          echo "::warning title=Vercel Token Required::VERCEL_TOKEN secret is not set in GitHub repository settings. The bundle was built successfully, but automatic Vercel deployment was skipped. To enable automatic Vercel deployment, add your token to GitHub Settings -> Secrets and variables -> Actions."
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

